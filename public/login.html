<!DOCTYPE html>
<html>
<head>
    <title>Login - El Patio</title>
    <style>
        body { background: #1a1a2e; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #16213e; padding: 40px; border-radius: 10px; width: 300px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #666; cursor: not-allowed; }
        #msg { margin-top: 10px; min-height: 20px; }
        .error { color: #ff6b6b; }
        .success { color: #4ecca3; }
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-right: 5px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔐 El Patio RP</h2>
        <input type="password" id="key" placeholder="Clave de admin" autocomplete="off">
        <button onclick="login()" id="btn">Entrar</button>
        <div id="msg"></div>
    </div>
    <script>
        // Config
        const API_URL = 'https://el-patio-rp-pro-streaming-production.up.railway.app/api';
        
        async function login() {
            const key = document.getElementById('key').value.trim();
            const msg = document.getElementById('msg');
            const btn = document.getElementById('btn');
            
            if(!key) {
                msg.textContent = 'Ingresa la clave';
                msg.className = 'error';
                return;
            }
            
            // Estado de carga
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Verificando...';
            msg.textContent = '';
            
            try {
                const res = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({key})
                });
                
                const data = await res.json();
                
                if(res.ok && data.success && data.token) {
                    msg.textContent = '✓ Acceso concedido';
                    msg.className = 'success';
                    
                    // Guardar token temporal (no la clave cruda)
                    sessionStorage.setItem('patio_token', data.token);
                    sessionStorage.setItem('patio_expires', Date.now() + (data.expiresIn || 3600000));
                    
                    // Redirigir después de breve delay
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 500);
                    
                } else {
                    throw new Error(data.message || 'Clave incorrecta');
                }
            } catch(e) {
                msg.textContent = e.message || 'Error de conexión';
                msg.className = 'error';
                console.error('Login error:', e);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        }
        
        // Permitir Enter para enviar
        document.getElementById('key').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') login();
        });
        
        // Verificar si ya hay sesión válida
        window.onload = () => {
            const token = sessionStorage.getItem('patio_token');
            const expires = sessionStorage.getItem('patio_expires');
            
            if(token && expires && Date.now() < parseInt(expires)) {
                window.location.href = '/dashboard.html';
            }
        };
    </script>
</body>
</html>
