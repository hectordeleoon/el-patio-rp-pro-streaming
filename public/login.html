<!DOCTYPE html>
<html>
<head>
    <title>Login - El Patio</title>
    <style>
        body { background: #1a1a2e; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #16213e; padding: 40px; border-radius: 10px; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: none; border-radius: 5px; }
        button { width: 100%; padding: 10px; background: #e94560; color: white; border: none; border-radius: 5px; cursor: pointer; }
        #msg { margin-top: 10px; color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🔐 El Patio RP</h2>
        <input type="password" id="key" placeholder="Clave de admin">
        <button onclick="login()">Entrar</button>
        <div id="msg"></div>
    </div>
    <script>
        async function login() {
            const key = document.getElementById('key').value;
            const msg = document.getElementById('msg');
            
            try {
                // USA LA URL EXACTA DE RAILWAY
                const res = await fetch('https://el-patio-rp-pro-streaming-production.up.railway.app/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({key: key})
                });
                
                const data = await res.json();
                
                if(data.success) {
                    localStorage.setItem('patio_key', key);
                    window.location.href = '/dashboard.html';
                } else {
                    msg.textContent = 'Clave incorrecta';
                }
            } catch(e) {
                msg.textContent = 'Error de conexión: ' + e.message;
                console.error(e);
            }
        }
    </script>
</body>
</html>
