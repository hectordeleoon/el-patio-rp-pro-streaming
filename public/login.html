<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - El Patio Bot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5568d3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .error {
            color: #e74c3c;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .success {
            color: #27ae60;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .debug-info {
            margin-top: 20px;
            padding: 10px;
            background: #f4f4f4;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
            font-family: monospace;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 El Patio RP</h1>
        <p class="subtitle">Panel de Administración</p>
        
        <div class="input-group">
            <label for="key">Clave de Acceso:</label>
            <input type="password" id="key" placeholder="Ingresa tu clave admin o staff" autocomplete="off">
        </div>
        
        <button onclick="login()" id="loginBtn">
            <span class="spinner" id="spinner"></span>
            <span id="btnText">Ingresar</span>
        </button>
        
        <div id="error" class="error"></div>
        <div id="success" class="success"></div>
        
        <div id="debug" class="debug-info"></div>
    </div>

    <script>
        // Detectar la URL base automáticamente
        const API_URL = window.location.origin;
        
        async function login() {
            const keyInput = document.getElementById('key');
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            const debugDiv = document.getElementById('debug');
            const btn = document.getElementById('loginBtn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btnText');
            
            const key = keyInput.value.trim();
            
            // Reset
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            debugDiv.style.display = 'none';
            
            if (!key) {
                errorDiv.textContent = 'Por favor ingresa una clave';
                errorDiv.style.display = 'block';
                return;
            }
            
            // Loading state
            btn.disabled = true;
            spinner.style.display = 'inline-block';
            btnText.textContent = 'Verificando...';
            
            try {
                console.log('Enviando petición a:', `${API_URL}/api/login`);
                
                const response = await fetch(`${API_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ key: key })
                });
                
                const data = await response.json();
                console.log('Respuesta:', data);
                
                if (response.ok && data.success) {
                    successDiv.textContent = `✅ Acceso concedido como ${data.role.toUpperCase()}`;
                    successDiv.style.display = 'block';
                    
                    // Guardar en localStorage
                    localStorage.setItem('patio_key', key);
                    localStorage.setItem('patio_role', data.role);
                    
                    // Redirigir al dashboard después de 1 segundo
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                    
                } else {
                    errorDiv.textContent = data.error || '❌ Clave inválida';
                    errorDiv.style.display = 'block';
                }
                
            } catch (error) {
                console.error('Error completo:', error);
                errorDiv.textContent = '❌ Error de conexión. Revisa la consola (F12)';
                errorDiv.style.display = 'block';
                
                // Debug info
                debugDiv.style.display = 'block';
                debugDiv.innerHTML = `
                    <strong>Debug:</strong><br>
                    URL: ${API_URL}/api/login<br>
                    Error: ${error.message}<br>
                    Estado: Verifica que el servidor esté corriendo
                `;
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.textContent = 'Ingresar';
            }
        }
        
        // Permitir login con Enter
        document.getElementById('key').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
        
        // Autollenar si hay key guardada (opcional)
        window.onload = () => {
            const savedKey = localStorage.getItem('patio_key');
            if (savedKey) {
                document.getElementById('key').value = savedKey;
            }
        };
    </script>
</body>
</html>
