<!DOCTYPE html>
<html>
<head>
    <title>El Patio Admin</title>
    <style>
        body { background: #111; color: white; font-family: Arial; padding: 50px; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; }
        #login { max-width: 400px; margin: 0 auto; text-align: center; }
        #panel { display: none; }
        .error { color: #ff4444; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="login">
        <h1>🎮 El Patio RP</h1>
        <input type="password" id="key" placeholder="Clave admin"><br>
        <button onclick="doLogin()">Entrar</button>
        <div id="error" class="error"></div>
        <br><br>
        <button onclick="testAPI()" style="font-size: 12px; opacity: 0.5;">Test API</button>
        <div id="test-result"></div>
    </div>

    <div id="panel">
        <h2>✅ Conectado correctamente</h2>
        <button onclick="location.reload()">Salir</button>
    </div>

    <script>
        const API = window.location.origin; // Detecta Railway automáticamente
        
        async function doLogin() {
            const key = document.getElementById('key').value;
            try {
                const res = await fetch(API + '/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({key})
                });
                const data = await res.json();
                if(data.success) {
                    document.getElementById('login').style.display = 'none';
                    document.getElementById('panel').style.display = 'block';
                    localStorage.setItem('key', key);
                } else {
                    document.getElementById('error').textContent = 'Clave incorrecta';
                }
            } catch(e) {
                document.getElementById('error').textContent = 'Error: ' + e.message;
            }
        }
        
        async function testAPI() {
            try {
                const res = await fetch(API + '/api/status');
                const data = await res.json();
                document.getElementById('test-result').innerHTML = 
                    '<span style="color: #0f0">✅ Backend OK: ' + data.bot + '</span>';
            } catch(e) {
                document.getElementById('test-result').innerHTML = 
                    '<span style="color: #f00">❌ Error: ' + e.message + '</span>';
            }
        }
    </script>
</body>
</html>
