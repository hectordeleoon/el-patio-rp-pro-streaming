<!DOCTYPE html>
<html>
<head>
    <title>El Patio Admin</title>
    <style>
        body { background: #111; color: white; font-family: Arial; padding: 50px; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; }
        #login { max-width: 400px; margin: 0 auto; text-align: center; }
        #panel { display: none; }
        .error { color: #ff4444; margin-top: 10px; }
        .loading { opacity: 0.6; pointer-events: none; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .stat-card { background: #1a1a1a; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-number { font-size: 2rem; color: #7c5cff; font-weight: bold; }
    </style>
</head>
<body>
    <div id="login">
        <h1>🎮 El Patio RP</h1>
        <input type="password" id="key" placeholder="Clave admin" autocomplete="off"><br>
        <button onclick="doLogin()" id="btn-login">Entrar</button>
        <div id="error" class="error"></div>
    </div>

    <div id="panel">
        <h2>✅ Dashboard Admin</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="stat-streamers">0</div>
                <div>Streamers</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="stat-live">0</div>
                <div>En Vivo</div>
            </div>
        </div>
        <div id="panel-content"></div>
        <button onclick="doLogout()" style="margin-top: 20px;">Salir</button>
    </div>

    <script>
        const API = window.location.origin;
        let currentKey = null;

        window.onload = () => {
            const saved = sessionStorage.getItem('admin_key');
            if(saved) verifyKey(saved);
        };

        async function doLogin() {
            const btn = document.getElementById('btn-login');
            const key = document.getElementById('key').value;
            
            if(!key) return showError('Introduce la clave');
            
            btn.classList.add('loading');
            btn.textContent = 'Verificando...';
            
            try {
                // Intentar login
                const res = await fetch(`${API}/api/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({key})
                });
                
                const data = await res.json();
                
                if(data.success) {
                    currentKey = key;
                    sessionStorage.setItem('admin_key', key);
                    showPanel();
                    loadData();
                } else {
                    showError('Clave incorrecta');
                }
            } catch(e) {
                showError('Error de conexión');
            } finally {
                btn.classList.remove('loading');
                btn.textContent = 'Entrar';
            }
        }

        async function verifyKey(key) {
            try {
                const res = await fetch(`${API}/api/verify`, {
                    headers: {'X-Admin-Key': key}
                });
                if(res.ok) {
                    currentKey = key;
                    showPanel();
                    loadData();
                } else {
                    sessionStorage.removeItem('admin_key');
                }
            } catch(e) {
                sessionStorage.removeItem('admin_key');
            }
        }

        function showPanel() {
            document.getElementById('login').style.display = 'none';
            document.getElementById('panel').style.display = 'block';
        }

        async function loadData() {
            try {
                const res = await fetch(`${API}/api/stats`, {
                    headers: {'X-Admin-Key': currentKey}
                });
                if(!res.ok) throw new Error('No autorizado');
                
                const data = await res.json();
                document.getElementById('stat-streamers').textContent = data.streamers;
                document.getElementById('stat-live').textContent = data.liveNow;
                
                document.getElementById('panel-content').innerHTML = `
                    <p>🪙 Total Coins: ${data.totalCoins}</p>
                    <p>⏳ Solicitudes pendientes: ${data.pending}</p>
                `;
            } catch(e) {
                document.getElementById('panel-content').innerHTML = '<p>Error cargando datos</p>';
            }
        }

        function doLogout() {
            currentKey = null;
            sessionStorage.removeItem('admin_key');
            location.reload();
        }

        function showError(msg) {
            const el = document.getElementById('error');
            el.textContent = msg;
            setTimeout(() => el.textContent = '', 3000);
        }
    </script>
</body>
</html>
